name: Refresh grant data

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-grant-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh official grant data
        run: npm run refresh

      - name: Validate data and filters
        run: npm test

      - name: Commit updated data
        run: |
          if git diff --quiet -- grants.json public/grants.json; then
            echo "Grant data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grants.json public/grants.json
          git commit -m "Refresh California grant data"
          git push
