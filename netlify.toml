[build]
  command = "node scripts/refresh.js"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."refresh-grants"]
  schedule = "@weekly"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/public/grants.json"
  [headers.values]
    Cache-Control = "public, max-age=900, stale-while-revalidate=86400"
